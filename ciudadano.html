<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nenapp • Mapa en Vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="overflow-hidden fade-in">

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Barra Superior -->
    <div class="floating-header flex items-center justify-between gap-3 slide-down">
        <div class="bg-slate-900/90 backdrop-blur border border-slate-700/60 px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 flex-1">
            <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input type="text" id="searchInput" placeholder="¿Dónde está mi camión?" class="bg-transparent text-sm text-white placeholder-slate-400 outline-none w-full">
        </div>
        <a href="index.html" class="bg-slate-900/90 backdrop-blur border border-slate-700/60 p-3 rounded-2xl shadow-xl text-indigo-400 hover:text-white transition active:scale-95 flex-shrink-0">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
        </a>
    </div>

    <!-- Bottom Sheet Info -->
    <div class="floating-card slide-up" id="cardInfo">
        <div class="w-12 h-1.5 bg-slate-600 rounded-full mx-auto mb-4 opacity-50"></div>
        <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-indigo-500/20 rounded-full flex items-center justify-center border border-indigo-500/30">
                    <span class="text-xl">🚛</span>
                </div>
                <div>
                    <h3 id="infoCamion" class="text-lg font-bold text-white">Buscando unidades...</h3>
                    <p id="infoDetalle" class="text-xs text-indigo-300 font-medium">Conectando al servidor</p>
                </div>
            </div>
            <span id="badgeEstado" class="px-3 py-1 bg-slate-800 border border-slate-700 text-slate-400 text-xs rounded-full font-semibold">Inactivo</span>
        </div>
        <div class="border-t border-slate-700/50 pt-4 mt-4 flex justify-between items-center">
            <div class="text-xs text-slate-400 flex flex-col gap-1">
                <span>Operador: <strong id="infoOperador" class="text-slate-200">Por definir</strong></span>
                <span>Ruta: <strong class="text-slate-200">General</strong></span>
            </div>
            <button onclick="centrarMapa()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-indigo-600/30 active:scale-95 flex items-center gap-2">
                Seguir 📍
            </button>
        </div>
        <button class="w-full mt-4 py-3 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 rounded-xl text-sm font-semibold transition active:scale-95">
            + Reportar Incidente
        </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/config.js"></script>
    <script src="js/script-ciudadano.js"></script>
</body>
</html>
