<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nenapp • Aseo Público</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6 fade-in">
    <div class="text-center max-w-sm w-full">
        <div class="inline-flex items-center justify-center w-24 h-24 bg-indigo-600/20 border border-indigo-500/30 rounded-3xl mb-6 shadow-lg shadow-indigo-500/10 float-animation">
            <svg class="w-12 h-12 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
            </svg>
        </div>
        
        <h1 class="text-4xl font-extrabold tracking-tight mb-2">Nenapp</h1>
        <p class="text-slate-400 text-sm mb-10">Servicio de Aseo Público en Tiempo Real</p>

        <div class="space-y-4">
            <a href="ciudadano.html" class="flex items-center justify-center gap-3 w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-600/30 transition transform active:scale-95">
                <span class="text-xl">🗺️</span> Ver Mapa Ciudadano
            </a>
            <a href="chofer.html" class="flex items-center justify-center gap-3 w-full py-4 px-6 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold rounded-2xl transition transform active:scale-95">
                <span class="text-xl">🚛</span> Modo Operador (GPS)
            </a>
        </div>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado', reg))
                    .catch(err => console.error('Error al registrar SW', err));
            });
        }
    </script>
</body>
</html>
